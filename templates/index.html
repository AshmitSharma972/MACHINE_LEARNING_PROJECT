<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Prediction System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#2563eb);
            font-family:Arial,Helvetica,sans-serif;
        }

        .card{
            width:700px;
            padding:40px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }

        h1{
            color:#0d6efd;
            font-weight:bold;
            margin-bottom:20px;
        }

        p{
            font-size:18px;
            color:#555;
            margin-bottom:30px;
        }

        .btn-custom{
            width:250px;
            height:55px;
            font-size:20px;
            font-weight:bold;
        }

        footer{
            margin-top:30px;
            color:#888;
            font-size:15px;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Student Exam Performance Prediction</h1>

    <p>
        Predict a student's Mathematics score using
        demographic information and previous exam scores
        with a Machine Learning model.
    </p>

    <a href="{{ url_for('predict_datapoint') }}"
       class="btn btn-primary btn-custom">
        Start Prediction
    </a>

    <footer>
        End-to-End Machine Learning Project
    </footer>

</div>

</body>
</html>
